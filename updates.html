<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  color-scheme:dark;
  --bg:#060812;--bg2:#0d1117;--surface:#111827;--border:rgba(88,101,242,0.18);
  --blue:#5865F2;--blue2:#7289da;--blue3:#99aab5;--cyan:#00d4ff;--accent:#eb459e;
  --green:#57f287;--text:#e8eaf0;--muted:#8b95a8;
  --spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease-out:cubic-bezier(0.16,1,0.3,1);
}
:root[data-theme="light"]{
  color-scheme:light;--bg:#eef4ff;--bg2:#e2ebff;--surface:#fff;--border:rgba(42,68,162,0.22);
  --blue:#3F5CF4;--blue2:#5973F5;--blue3:#4f618d;--cyan:#00b8cc;--accent:#d93d8f;
  --green:#16b875;--text:#101b3d;--muted:#4d618a;
}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.page{position:relative;z-index:1;}

/* ===== NAV ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:60px;
  background:rgba(6,8,18,0.82);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
:root[data-theme="light"] nav{background:rgba(238,244,255,0.9);}
.nav-logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;}
.nav-logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-size:.7rem;font-weight:900;color:#fff;}
.nav-links{display:flex;align-items:center;gap:1.4rem;list-style:none;}
.nav-links a{font-size:.88rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.nav-right{display:flex;align-items:center;gap:.8rem;}
.btn-back{display:flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.82rem;font-weight:600;text-decoration:none;transition:all .2s;}
.btn-back:hover{color:var(--text);border-color:var(--blue);background:rgba(88,101,242,.08);}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .2s;}
.theme-toggle:hover{color:var(--text);border-color:var(--blue);background:rgba(88,101,242,.1);}
.theme-toggle svg{width:16px;height:16px;fill:currentColor;}
@media(max-width:768px){.nav-links{display:none;}.nav{padding:0 1rem;}}

.d-container {

  margin: 0 auto;
  padding: 110px 2rem 60px;
}

.d-header {
  display: flex;
  align-items: center;
  gap: 1.2rem;

}
.d-header-icon {

}

  color: #fff;

  line-height: 1.1;

}

  color: #949ba4;

}

.d-card {

}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(28px); }
  100% { opacity: 1; transform: translateY(0); }
}

.d-card-top {

.gradient-2 { background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6, #d946ef); }

.d-posted {

}

.d-author {
  color: #dbdee1;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;

}
.d-author:hover {

}

}

}

.d-body {
  color: #dbdee1;
  font-size: 1rem;
  line-height: 1.45;
}

.d-body p { margin-bottom: 0.8rem; }
.d-body ul { list-style: none; padding: 0; }
.d-body li { position: relative; margin-bottom: 0.4rem; padding-left: 1.2rem; }
.d-body li::before { content: "•"; position: absolute; left: 0; color: #5865F2; font-weight: 900; }
.d-body strong { font-weight: 700; color: #f2f3f5; }
:root[data-theme="light"] .d-body strong { color: #111827; }
.d-body a { color: #00a8fc; text-decoration: none; }
.d-body a:hover { text-decoration: underline; }

.d-h1 { font-size:1.5rem; font-weight:800; margin:1rem 0 0.5rem; color:#f2f3f5; }
.d-h2 { font-size:1.25rem; font-weight:700; margin:0.8rem 0 0.4rem; color:#f2f3f5; }
.d-h3 { font-size:1.1rem; font-weight:700; margin:0.6rem 0 0.3rem; color:#f2f3f5; }
:root[data-theme="light"] .d-h1, :root[data-theme="light"] .d-h2, :root[data-theme="light"] .d-h3 { color:#111827; }

.d-blockquote { border-left:4px solid #4f545c; padding-left:12px; margin-left:4px; margin-top:2px; margin-bottom:2px; color:#b5bac1; }
:root[data-theme="light"] .d-blockquote { border-left-color: #d1d5db; color: #4b5563; }

.d-code { background:#1e1f22; color:#dbdee1; padding:2px 4.5px; border-radius:4px; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.9em; }
:root[data-theme="light"] .d-code { background:rgba(0,0,0,0.05); color:#111827; }

.d-link { color:#00a8fc; text-decoration:none; }
.d-link:hover { text-decoration:underline; }

.d-mention {
  background: rgba(88, 101, 242, 0.3);
  color: #c9cdfb;
  padding: 0 4px;
  border-radius: 4px;
  font-weight: 500;

  text-decoration: none;
  display: inline-flex;
  align-items: center;
  transition: all 0.2s;
}
.d-mention:hover {

  color: #fff;
}
:root[data-theme="light"] .d-mention {
  background: rgba(88, 101, 242, 0.15);

}
:root[data-theme="light"] .d-mention:hover {

.loading {

<script>
// Theme toggle
var tt=document.getElementById('tt'),moon=document.getElementById('moon'),sun=document.getElementById('sun');
function updIcon(){var d=document.documentElement.getAttribute('data-theme')==='dark';moon.style.display=d?'block':'none';sun.style.display=d?'none':'block';}
updIcon();
tt.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);updIcon();});

// Particle canvas
var canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d'),W,H,pts;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
function Pt(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.28;this.vy=(Math.random()-.5)*.28;this.r=Math.random()*1.4+.3;this.a=Math.random()*.38+.08;}
Pt.prototype.upd=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1;};
pts=Array.from({length:72},function(){return new Pt();});
var cols=['#5865F2','#00d4ff','#7289da'];
function draw(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(function(p){p.upd();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=cols[Math.floor(Math.random()*3)];ctx.globalAlpha=p.a;ctx.fill();});
  ctx.globalAlpha=1;
  for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<105){ctx.beginPath();ctx.strokeStyle='#5865F2';ctx.globalAlpha=(1-d/105)*.055;ctx.lineWidth=.5;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}}
  ctx.globalAlpha=1;requestAnimationFrame(draw);
}
draw();

// Formatting utilities
function formatDiscordText(text) {
  if (!text) return '';
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); // escape html

  // Markdown Links [text](url)
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="d-link">$1</a>');

  // Headings
  html = html.replace(/^### (.*?)$/gm, '<h3 class="d-h3">$1</h3>');
  html = html.replace(/^## (.*?)$/gm, '<h2 class="d-h2">$1</h2>');
  html = html.replace(/^# (.*?)$/gm, '<h1 class="d-h1">$1</h1>');

  // Multiline blockquote (>>> )
  if (html.includes('&gt;&gt;&gt; ')) {
    html = html.replace(/&gt;&gt;&gt; ([\s\S]*)$/, '<div class="d-blockquote">$1</div>');
  }
  
  // Single line blockquote (> )
  html = html.replace(/^&gt; (.*?)$/gm, '<div class="d-blockquote">$1</div>');

  // Mentions
  html = html.replace(/&lt;#(\d+)&gt;/g, '<span class="d-mention">#channel</span>');
  html = html.replace(/&lt;@!?(\d+)&gt;/g, '<span class="d-mention">@user</span>');
  html = html.replace(/&lt;@&amp;(\d+)&gt;/g, '<span class="d-mention">@role</span>');
  
  // Discord Channel URLs
  html = html.replace(/(https?:\/\/discord\.com\/channels\/\d+\/(\d+))/g, (match, url, channelId) => {
    let name = "channel";
    if (channelId === "1520460544811859968") name = "🚀・updates";
    return `<a href="${url}" target="_blank" rel="noopener" class="d-mention"># ${name}</a>`;
  });

  // Custom Emojis
  html = html.replace(/&lt;(a?):([a-zA-Z0-9_]+):(\d+)&gt;/g, (match, isAnimated, name, id) => {
    const ext = isAnimated ? 'gif' : 'png';
    return `<img src="https://cdn.discordapp.com/emojis/${id}.${ext}?v=1" alt=":${name}:" style="width:1.4em;height:1.4em;vertical-align:bottom;display:inline-block;margin:0 2px;" />`;
  });
  
  // Basic formatting
  html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
             .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
             .replace(/\*(.*?)\*/g, '<em>$1</em>')
             .replace(/__(.*?)__/g, '<u>$1</u>')
             .replace(/(?<![A-Za-z0-9])_(.*?)_(?![A-Za-z0-9])/g, '<em>$1</em>')
             .replace(/~~(.*?)~~/g, '<del>$1</del>')
             .replace(/`([^`]+)`/g, '<code class="d-code">$1</code>');
             
  // Raw URLs (not already part of an anchor tag or mention)
  html = html.replace(/(?<!href="|src=")(https?:\/\/[^\s<"]+)/g, '<a href="$1" target="_blank" rel="noopener" class="d-link">$1</a>');
  
  // Newlines
  html = html.replace(/\n/g, '<br>');
  
  // Cleanup rogue `<br>` after block elements to prevent huge gaps
  html = html.replace(/<\/h1><br>/g, '</h1>');
  html = html.replace(/<\/h2><br>/g, '</h2>');
  html = html.replace(/<\/h3><br>/g, '</h3>');
  html = html.replace(/<\/div><br>/g, '</div>');

  return html;
}

function formatDate(isoString) {
  const d = new Date(isoString);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let hours = d.getHours();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  const mins = d.getMinutes().toString().padStart(2, '0');
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${hours}:${mins} ${ampm}`;
}

// Fetch and render JSON
async function loadAnnouncements() {
  const container = document.getElementById('announcements-list');
  try {
    const res = await fetch('./data/announcements.json?t=' + new Date().getTime());
    if (!res.ok) throw new Error('Data not found');
    const msgs = await res.json();
    
    if (msgs.length === 0) {
      container.innerHTML = '<p class="loading">No recent announcements found.</p>';
      return;
    }
    
    let html = '';
    msgs.forEach((msg, index) => {
      const gradClass = 'gradient-' + ((index % 3) + 1);
      
      let title = "Announcement";
      let bodyHtml = "";
      
      // Handle normal content
      if (msg.content && msg.content.trim().length > 0) {
        const firstLineMatch = msg.content.match(/^([^\n]+)\n([\s\S]*)$/);
        if (firstLineMatch && /^(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]|#|\*\*|<a?:)/.test(firstLineMatch[1].trim())) {
          title = formatDiscordText(firstLineMatch[1].trim());
          bodyHtml += formatDiscordText(firstLineMatch[2]);
        } else if (msg.content.length < 50) {
          title = formatDiscordText(msg.content);
        } else {
          bodyHtml += formatDiscordText(msg.content);
        }
      }
      
      // Handle embeds
      if (msg.embeds && msg.embeds.length > 0) {
        msg.embeds.forEach(embed => {
          if (embed.title) {
            title = formatDiscordText(embed.title);
          }
          if (embed.description) {
            bodyHtml += '<div style="margin-top: 1rem;">' + formatDiscordText(embed.description) + '</div>';
          }
          if (embed.fields && embed.fields.length > 0) {
            bodyHtml += '<div style="margin-top: 1.5rem;">';
            embed.fields.forEach(field => {
              bodyHtml += '<div style="margin-bottom: 1rem;">';
              bodyHtml += '<div style="font-weight: 800; color: #fff; margin-bottom: 0.2rem;">' + formatDiscordText(field.name) + '</div>';
              bodyHtml += '<div style="color: #dbdee1;">' + formatDiscordText(field.value) + '</div>';
              bodyHtml += '</div>';
            });
            bodyHtml += '</div>';
          }
        });
      }
      
      // Fallback if no title could be parsed
      if (!title || title === "Announcement") {
         title = msg.author + " Update";
      }
      
      const authorLink = msg.author_id ? `https://discord.com/users/${msg.author_id}` : `https://discord.gg/FnsJYbmW4A`;
      const avatarUrl = msg.author_avatar ? `https://cdn.discordapp.com/avatars/${msg.author_id}/${msg.author_avatar}.png` : 'https://cdn3.emoji.gg/emojis/494996-announcement.png';
      
      html += `
      <div class="d-card" style="animation-delay: ${index * 0.1}s;">
        <div class="d-card-top ${gradClass}"></div>
        <div class="d-card-inner">
          <h2 class="d-title">${title}</h2>
          <div class="d-meta">
            <span class="d-badge">
              <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg> 
              ${formatDate(msg.timestamp)}
            </span>
            <span class="d-posted">
              <span style="opacity: 0.7;">Posted by</span>
              <a href="${authorLink}" target="_blank" class="d-author">
                <img src="${avatarUrl}" alt="" style="width:20px;height:20px;border-radius:50%;">
                ${msg.author}
              </a>
            </span>
          </div>
          <div class="d-body">
            ${bodyHtml}
          </div>
        </div>
      </div>
      `;
    });
    container.innerHTML = html;
  } catch(e) {
    console.error(e);
    container.innerHTML = '<p class="loading">Syncing live announcements failed. Please try again later.</p>';
  }
}

document.addEventListener('DOMContentLoaded', loadAnnouncements);
</script>
</body>
</html>
