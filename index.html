<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="description" content="Sync Ink — Developer, gamer & creative coder."/>
<title>Sync Ink — Developer & Gamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ============ RESET & ROOT ============ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#060812;
  --bg2:#0d1117;
  --surface:#111827;
  --surface2:#1a2233;
  --border:rgba(88,101,242,0.18);
  --blue:#5865F2;
  --blue2:#7289da;
  --blue3:#99aab5;
  --cyan:#00d4ff;
  --accent:#eb459e;
  --green:#57f287;
  --text:#e8eaf0;
  --muted:#8b95a8;
  --card:rgba(17,24,39,0.8);
  --glow:rgba(88,101,242,0.4);
}
html{scroll-behavior:smooth;font-size:16px;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
  cursor:none;
  line-height:1.6;
}
img, video {max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
button{border:none;background:none;cursor:none;font-family:inherit;}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px;}

/* ============ CURSOR (desktop only) ============ */
.cur-dot,.cur-ring{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;}
.cur-dot{width:7px;height:7px;background:var(--cyan);top:0;left:0;transform:translate(-50%,-50%);transition:transform 0.1s;}
.cur-ring{width:36px;height:36px;border:1.5px solid var(--blue);top:0;left:0;transform:translate(-50%,-50%);transition:width 0.3s,height 0.3s,border-color 0.3s,background 0.3s;}
body.hov .cur-ring{width:56px;height:56px;background:rgba(88,101,242,0.1);border-color:var(--cyan);}
@media(max-width:768px){.cur-dot,.cur-ring{display:none;}body{cursor:auto;}button,a{cursor:pointer;}}

/* ============ CANVAS BG ============ */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ============ NOISE ============ */
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ============ NAV ============ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.9rem 2rem;
  background:rgba(6,8,18,0.7);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  transition:background 0.4s;
}
.nav-logo{
  display:flex;align-items:center;gap:0.6rem;
  font-weight:900;font-size:1.15rem;letter-spacing:-0.02em;color:var(--text);
}
.nav-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;font-weight:900;color:#fff;letter-spacing:0;
  box-shadow:0 0 14px rgba(88,101,242,0.5);
  flex-shrink:0;
}
.nav-links{display:flex;align-items:center;gap:0.3rem;}
.nav-link{
  padding:0.45rem 0.9rem;border-radius:8px;
  font-size:0.82rem;font-weight:600;color:var(--muted);
  letter-spacing:0.02em;transition:color 0.2s,background 0.2s;
}
.nav-link:hover{color:var(--text);background:var(--surface);}
.nav-dc{
  display:flex;align-items:center;gap:0.45rem;
  padding:0.45rem 1rem;border-radius:8px;
  background:var(--blue);color:#fff;
  font-size:0.8rem;font-weight:700;
  transition:background 0.2s,transform 0.2s,box-shadow 0.2s;
  box-shadow:0 0 12px rgba(88,101,242,0.35);
}
.nav-dc:hover{background:#4752c4;transform:translateY(-1px);box-shadow:0 0 20px rgba(88,101,242,0.55);}
.nav-dc svg{width:15px;height:15px;fill:#fff;flex-shrink:0;}
.hamburger{display:none;flex-direction:column;gap:5px;padding:4px;z-index:201;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all 0.3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.mobile-menu{
  display:none;position:fixed;inset:0;z-index:199;
  background:rgba(6,8,18,0.97);backdrop-filter:blur(20px);
  flex-direction:column;align-items:center;justify-content:center;gap:2rem;
}
.mobile-menu.open{display:flex;}
.mobile-menu .nav-link{font-size:1.4rem;font-weight:700;color:var(--text);padding:0.6rem 2rem;}
.mobile-menu .nav-dc{font-size:1rem;padding:0.8rem 2rem;}
@media(max-width:768px){
  .nav-links{display:none;}
  .hamburger{display:flex;}
  nav{padding:0.8rem 1.2rem;}
}

/* ============ HERO ============ */
.hero{
  min-height:100vh;display:flex;align-items:center;
  padding:7rem 2rem 4rem;
  position:relative;z-index:10;
}
.hero-inner{
  max-width:1100px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:0.6rem;
  background:rgba(88,101,242,0.12);border:1px solid rgba(88,101,242,0.3);
  padding:0.4rem 1rem;border-radius:100px;
  font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--blue2);
  margin-bottom:1.4rem;letter-spacing:0.05em;
  opacity:0;transform:translateY(14px);animation:fadeUp 0.7s ease 0.1s forwards;
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(87,242,135,0.5);}50%{box-shadow:0 0 0 6px rgba(87,242,135,0);}}
.hero-name{
  font-size:clamp(3rem,7vw,6rem);font-weight:900;
  letter-spacing:-0.04em;line-height:0.95;
  background:linear-gradient(135deg,#fff 30%,var(--blue2) 70%,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:0.5rem;
  opacity:0;transform:translateY(30px);animation:fadeUp 0.9s ease 0.3s forwards;
}
.hero-sub{
  font-size:clamp(1rem,2.5vw,1.35rem);font-weight:300;color:var(--muted);
  margin-bottom:1.5rem;
  opacity:0;transform:translateY(20px);animation:fadeUp 0.8s ease 0.5s forwards;
}
.hero-sub span{color:var(--blue2);font-weight:600;}
.hero-desc{
  font-family:'Crimson Pro',serif;font-size:clamp(1rem,1.8vw,1.15rem);
  color:var(--muted);line-height:1.8;margin-bottom:2rem;max-width:480px;
  opacity:0;transform:translateY(20px);animation:fadeUp 0.8s ease 0.65s forwards;
}
.hero-desc strong{color:var(--text);font-weight:600;}
.hero-btns{
  display:flex;gap:0.9rem;flex-wrap:wrap;
  opacity:0;transform:translateY(20px);animation:fadeUp 0.8s ease 0.8s forwards;
}
.btn{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.75rem 1.6rem;border-radius:10px;
  font-family:'Outfit',sans-serif;font-weight:700;font-size:0.85rem;
  letter-spacing:0.02em;transition:all 0.25s;cursor:none;
  white-space:nowrap;
}
@media(max-width:768px){.btn{cursor:pointer;}}
.btn-primary{
  background:var(--blue);color:#fff;
  box-shadow:0 0 18px rgba(88,101,242,0.4);
}
.btn-primary:hover{background:#4752c4;box-shadow:0 0 28px rgba(88,101,242,0.65);transform:translateY(-2px);}
.btn-pink {
  background:var(--accent);color:#fff;
  box-shadow:0 0 18px rgba(235,69,158,0.4);
}
.btn-pink:hover {background:#c83685;box-shadow:0 0 28px rgba(235,69,158,0.65);transform:translateY(-2px);}
.btn-outline{
  background:transparent;color:var(--text);
  border:1px solid var(--border);
}
.btn-outline:hover{border-color:var(--blue);color:var(--blue2);background:rgba(88,101,242,0.07);transform:translateY(-2px);}
.btn-dc{background:var(--blue);color:#fff;box-shadow:0 0 16px rgba(88,101,242,0.4);}
.btn-dc:hover{background:#4752c4;box-shadow:0 0 26px rgba(88,101,242,0.6);transform:translateY(-2px);}
.btn-dc svg,.btn svg{width:17px;height:17px;fill:currentColor;flex-shrink:0;}
.btn-x{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-x:hover{border-color:var(--text);transform:translateY(-2px);}
.btn-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}
.btn-ig:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(220,39,67,0.4);}
.btn-gh{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-gh:hover{border-color:var(--text);background:rgba(255,255,255,0.05);transform:translateY(-2px);}

/* hero right — profile card */
.hero-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:2rem;
  backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(88,101,242,0.12),0 20px 60px rgba(0,0,0,0.4);
  opacity:0;transform:translateX(30px);animation:fadeRight 1s ease 0.5s forwards;
  position:relative;overflow:hidden;
}
.hero-card::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(88,101,242,0.2) 0%,transparent 70%);
  pointer-events:none;
}
.card-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}

/* FIXED AVATAR CSS */
.card-avatar {
  width: 70px; height: 70px; border-radius: 50%;
  box-shadow: 0 0 20px rgba(88,101,242,0.4); flex-shrink: 0;
  position: relative; padding: 0; background: none;
}
.card-avatar img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
}
.avatar-status-dot {
  position: absolute; bottom: 2px; right: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #747f8d; /* Default offline */
  border: 4px solid var(--surface);
  z-index: 2; transition: background 0.3s ease;
}

.card-info{}
.card-name{
  font-family: 'Courier New', Courier, monospace; 
  font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; margin-bottom: -2px;
}
.card-tag{
  font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.discord-badge {
  width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
}
.card-status{
  display:flex;align-items:center;gap:0.5rem;margin-top:0.4rem;
  font-size:0.8rem;color:var(--text); font-weight: 500;
}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#747f8d; flex-shrink:0; transition: background 0.3s ease;
}
.card-divider{height:1px;background:var(--border);margin:1.2rem 0;}
.card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1.2rem;}
.cstat{
  background:rgba(88,101,242,0.07);border:1px solid var(--border);
  border-radius:10px;padding:0.75rem 0.5rem;text-align:center;
}
.cstat-num{font-weight:900;font-size:1.2rem;color:var(--text);letter-spacing:-0.02em;}
.cstat-lbl{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}
.card-tags{display:flex;flex-wrap:wrap;gap:0.4rem;}
.ctag{
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;
  padding:0.3rem 0.7rem;border-radius:100px;
  border:1px solid var(--border);color:var(--muted);
  transition:all 0.2s;
}
.ctag:hover{border-color:var(--blue);color:var(--blue2);background:rgba(88,101,242,0.1);}
.ctag.blue{border-color:rgba(88,101,242,0.5);color:var(--blue2);background:rgba(88,101,242,0.1);}
.ctag.green{border-color:rgba(87,242,135,0.4);color:var(--green);background:rgba(87,242,135,0.08);}
.ctag.pink{border-color:rgba(235,69,158,0.4);color:var(--accent);background:rgba(235,69,158,0.08);}
@media(max-width:900px){
  .hero-inner{grid-template-columns:1fr;}
  .hero-card{opacity:1;transform:none;animation:fadeUp 0.9s ease 0.7s both;}
  .hero-name{font-size:clamp(2.5rem,10vw,4.5rem);}
}

/* ============ MARQUEE ============ */
.marquee-wrap{
  position:relative;z-index:10;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:0.9rem 0;overflow:hidden;
  background:rgba(17,24,39,0.6);backdrop-filter:blur(10px);
}
.marquee-track{display:flex;gap:2rem;white-space:nowrap;animation:marquee 30s linear infinite;}
.marquee-item{
  font-family:'JetBrains Mono',monospace;font-size:0.8rem;
  color:var(--muted);flex-shrink:0;display:flex;align-items:center;gap:2rem;
}
.marquee-item::after{content:'◆';color:var(--blue);font-size:0.6rem;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ============ SECTION BASE ============ */
section{position:relative;z-index:10;}
.container{max-width:1100px;margin:0 auto;width:100%;padding:0 1.5rem;}
.section-pad{padding:6rem 1.5rem;}
.s-label{
  font-family:'JetBrains Mono',monospace;font-size:0.7rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--blue2);
  display:flex;align-items:center;gap:0.8rem;margin-bottom:1.2rem;
}
.s-label::before{content:'';width:28px;height:1px;background:var(--blue);}
.s-heading{
  font-size:clamp(1.8rem,4vw,3rem);font-weight:900;
  letter-spacing:-0.03em;line-height:1.08;margin-bottom:1rem;
}
.s-heading em{
  font-family:'Crimson Pro',serif;font-style:italic;font-weight:400;
  color:var(--blue2);
}

/* ============ ABOUT ============ */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start;}
.about-text{font-family:'Crimson Pro',serif;font-size:1.12rem;color:var(--muted);line-height:1.85;margin-bottom:1rem;}
.about-text strong{color:var(--text);font-weight:600;}
.about-text a{color:var(--blue2);border-bottom:1px solid rgba(114,137,218,0.3);transition:border-color 0.2s;}
.about-text a:hover{border-color:var(--blue2);}
.about-cta{margin-top:1.5rem;display:flex;gap:0.8rem;flex-wrap:wrap;}
.interests{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:0.5rem;}
.interest-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.1rem;
  display:flex;align-items:center;gap:0.8rem;
  transition:border-color 0.3s,background 0.3s,transform 0.2s;
}
.interest-card:hover{border-color:var(--blue);background:rgba(88,101,242,0.08);transform:translateY(-2px);}
.ic-emoji{font-size:1.4rem;flex-shrink:0;}
.ic-name{font-weight:700;font-size:0.85rem;color:var(--text);}
.ic-sub{font-size:0.75rem;color:var(--muted);}
@media(max-width:768px){
  .about-grid{grid-template-columns:1fr;}
  .interests{grid-template-columns:1fr 1fr;}
}
@media(max-width:480px){.interests{grid-template-columns:1fr;}}

/* ============ SKILLS ============ */
.skills-bg{background:var(--bg2);}
.skills-wrap{max-width:1100px;margin:0 auto;}
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:16px;overflow:hidden;margin-top:2.5rem;}
.sk-card{
  background:var(--surface);padding:1.8rem 1.6rem;
  position:relative;overflow:hidden;
  transition:background 0.4s;
}
.sk-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  transform:translateY(110%);
  transition:transform 0.5s cubic-bezier(0.77,0,0.175,1);z-index:0;
}
.sk-card:hover::after{transform:translateY(0);}
.sk-icon{font-size:1.8rem;margin-bottom:1rem;position:relative;z-index:1;}
.sk-name{font-weight:800;font-size:0.95rem;margin-bottom:0.4rem;position:relative;z-index:1;color:var(--text);}
.sk-desc{font-size:0.82rem;color:var(--muted);line-height:1.6;position:relative;z-index:1;transition:color 0.3s;}
.sk-card:hover .sk-desc{color:rgba(255,255,255,0.85);}
.sk-card:hover .sk-name{color:#fff;}
@media(max-width:700px){.skills-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.skills-grid{grid-template-columns:1fr;}}

/* skill bars */
.bars-wrap{margin-top:2.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem 3rem;}
.bar-item{}
.bar-head{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);margin-bottom:0.5rem;letter-spacing:0.05em;}
.bar-track{height:3px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transform-origin:left;transform:scaleX(0);transition:transform 1.4s cubic-bezier(0.77,0,0.175,1);border-radius:3px;}
@media(max-width:600px){.bars-wrap{grid-template-columns:1fr;}}

/* ============ PROJECTS ============ */
.projects-list{margin-top:2.5rem;display:flex;flex-direction:column;gap:0;}
.proj{
  display:grid;grid-template-columns:60px 1fr auto;
  align-items:center;gap:2rem;
  padding:1.8rem 0;border-bottom:1px solid var(--border);
  text-decoration:none;color:inherit;
  position:relative;overflow:hidden;
  transition:padding-left 0.35s ease;
}
.proj::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:linear-gradient(var(--blue),var(--cyan));
  transform:scaleY(0);transform-origin:bottom;transition:transform 0.35s;
}
.proj:hover::before{transform:scaleY(1);}
.proj:hover{padding-left:1rem;}
.proj-num{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);}
.proj-name{font-size:clamp(1rem,2vw,1.4rem);font-weight:800;letter-spacing:-0.02em;margin-bottom:0.35rem;transition:color 0.3s;}
.proj:hover .proj-name{color:var(--blue2);}
.proj-tags{display:flex;gap:0.5rem;flex-wrap:wrap;}
.proj-tag{
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;
  padding:0.22rem 0.65rem;border-radius:100px;
  background:rgba(88,101,242,0.1);border:1px solid rgba(88,101,242,0.2);
  color:var(--blue3);
}
.proj-arrow{font-size:1.3rem;color:var(--muted);transition:all 0.3s;transform:rotate(-45deg);}
.proj:hover .proj-arrow{color:var(--cyan);transform:rotate(0deg);}
@media(max-width:600px){.proj{grid-template-columns:44px 1fr auto;gap:1rem;padding:1.4rem 0;}}

/* ============ BOTS SECTION ============ */
.bots-wrap{display:flex;flex-direction:column;gap:3rem;margin-top:2.5rem;}
.bot-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:2.5rem;position:relative;overflow:hidden;
  backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
.bot-card::before{
  content:'';position:absolute;top:-100px;right:-100px;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(88,101,242,0.15) 0%,transparent 70%);
  pointer-events:none;
}
.bot-card.radio-card::before{background:radial-gradient(circle,rgba(235,69,158,0.15) 0%,transparent 70%);}
.bot-header{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;margin-bottom:2.5rem;position:relative;z-index:2;}

/* BOT LOGO STYLING */
.bot-logo{
  width:80px;height:80px;border-radius:50%;
  box-shadow:0 0 24px rgba(88,101,242,0.4);flex-shrink:0;
  animation:floatLogo 4s ease-in-out infinite;
  background:rgba(255,255,255,0.05); padding:0; overflow:hidden;
}
.bot-logo img {
  width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;
}
.bot-logo.radio{
  box-shadow:0 0 24px rgba(235,69,158,0.4);
}

<script>
/* ====== REVEAL ANIMATIONS ====== */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revObs.unobserve(e.target); } });
}, {threshold: 0.1, rootMargin: '0px 0px -40px 0px'});
document.querySelectorAll('.reveal,.reveal-l,.reveal-r').forEach(el => revObs.observe(el));

/* ====== CANVAS ANIMATED BACKGROUND ====== */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = {x: 0, y: 0};
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W; this.y = Math.random() * H; this.size = Math.random() * 1.5 + 0.3;
    this.speedX = (Math.random() - 0.5) * 0.3; this.speedY = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.1; this.color = Math.random() > 0.6 ? '#5865F2' : Math.random() > 0.5 ? '#00d4ff' : '#7289da';
  }
  update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset(); }
  draw() {
    ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
for (let i = 0; i < 120; i++) particles.push(new Particle());
const orbs = [
  { x: 0.15, y: 0.2, r: 300, c: 'rgba(88,101,242,0.08)', speed: 0.0003 },
  { x: 0.85, y: 0.7, r: 250, c: 'rgba(0,212,255,0.06)', speed: 0.0004 },
  { x: 0.5, y: 0.9, r: 200, c: 'rgba(88,101,242,0.05)', speed: 0.0005 },
];
let t = 0;
function drawFrame() {
  ctx.clearRect(0, 0, W, H); t += 0.01;
  orbs.forEach((o, i) => {
    const ox = (o.x + Math.sin(t * o.speed * 1000 + i) * 0.05) * W;
    const oy = (o.y + Math.cos(t * o.speed * 1200 + i) * 0.04) * H;
    const grad = ctx.createRadialGradient(ox, oy, 0, ox, oy, o.r);
    grad.addColorStop(0, o.c); grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(ox, oy, o.r, 0, Math.PI * 2); ctx.fill();
  });
  particles.forEach(p => { p.update(); p.draw(); });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 100) {
        ctx.save(); ctx.globalAlpha = (1 - dist / 100) * 0.08; ctx.strokeStyle = '#5865F2';
        ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); ctx.restore();
      }
    }
  }
  requestAnimationFrame(drawFrame);
}
drawFrame();

/* ====== CURSOR ====== */
const curDot = document.getElementById('curDot');
const curRing = document.getElementById('curRing');
let mx=0, my=0, rx=0, ry=0;
if (window.innerWidth > 768) {
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; curDot.style.left = mx + 'px'; curDot.style.top = my + 'px'; });
  (function loop() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; curRing.style.left = rx + 'px'; curRing.style.top = ry + 'px'; requestAnimationFrame(loop); })();
  document.querySelectorAll('a,button,.interest-card,.sk-card,.proj,.proc-card,.testi-card,.soc-card,.cmd-category,.radio-cmd-tag,.plat-tag').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('hov'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('hov'));
  });
}

/* ====== NAV & MENUS ====== */
const nav = document.getElementById('mainNav');
window.addEventListener('scroll', () => { nav.style.background = window.scrollY > 40 ? 'rgba(6,8,18,0.95)' : 'rgba(6,8,18,0.7)'; }, {passive: true});
const ham = document.getElementById('hamburger'); const mmenu = document.getElementById('mobileMenu');
ham.addEventListener('click', () => { ham.classList.toggle('open'); mmenu.classList.toggle('open'); document.body.style.overflow = mmenu.classList.contains('open') ? 'hidden' : ''; });
document.querySelectorAll('[data-mm]').forEach(link => { link.addEventListener('click', () => { ham.classList.remove('open'); mmenu.classList.remove('open'); document.body.style.overflow = ''; }); });
document.querySelectorAll('a[href^="#"]').forEach(a => { a.addEventListener('click', e => { const t = document.querySelector(a.getAttribute('href')); if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth',block:'start'}); } }); });
document.getElementById('backTop').addEventListener('click', e => { e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });

/* ====== SKILL BARS ====== */
const barObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.querySelectorAll('.bar-fill').forEach((b, i) => { setTimeout(() => b.style.transform = `scaleX(${b.dataset.w})`, i * 150); });
      barObs.unobserve(e.target);
    }
  });
}, {threshold: 0.4});
const barsWrap = document.querySelector('.bars-wrap'); if (barsWrap) barObs.observe(barsWrap);

/* ====== TOAST & MODAL ====== */
function showToast(msg, dur=3200) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
const overlay = document.getElementById('cModal');
function openModal() { overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeModal() { overlay.classList.remove('open'); document.body.style.overflow = ''; }
['openContact','openContact2','openContact3'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('click', openModal); });
document.getElementById('mClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });


/* ====== DISCORD LANYARD STATUS SYNC ====== */
async function updateDiscordStatus() {
  const DISCORD_ID = "930306512864280607"; 
  
  const text = document.getElementById('status-text');
  const dot = document.getElementById('status-dot');
  const avatarDot = document.getElementById('avatar-status-dot');

  if (!text || !dot) return; 

  try {
    const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    const data = await response.json();
    
    if (data.success) {
      const status = data.data.discord_status; 
      
      let color = '#747f8d'; // Default Offline Grey
      let displayStatus = 'Offline';

      if (status === 'online') { color = '#57f287'; displayStatus = 'Online'; }
      else if (status === 'dnd') { color = '#ed4245'; displayStatus = 'Do Not Disturb'; }
      else if (status === 'idle') { color = '#faa61a'; displayStatus = 'Idle'; }

      // Update colors
      dot.style.backgroundColor = color;
      if(avatarDot) avatarDot.style.backgroundColor = color;
      
      // Pull Custom Status
      let customText = "";
      if (data.data.activities && data.data.activities.length > 0) {
        const customAct = data.data.activities.find(a => a.type === 4);
        if (customAct) {
            const emoji = customAct.emoji ? customAct.emoji.name : '';
            const state = customAct.state ? customAct.state : '';
            customText = ` — ${state} ${emoji}`;
        }
      }
      
      text.textContent = displayStatus + customText;

    } else {
      // IF LANYARD API FAILS (USER NOT IN SERVER)
      text.textContent = "Action Required: Join Lanyard Server!";
      dot.style.backgroundColor = '#faa61a'; // Yellow warning
      if(avatarDot) avatarDot.style.backgroundColor = '#faa61a';
    }
  } catch (error) {
    console.log("Could not fetch Discord status:", error);
    text.textContent = "API Connection Error";
  }
}
updateDiscordStatus();
setInterval(updateDiscordStatus, 5000);


/* ====== DISCORD WEBHOOK CONTACT FORM ====== */
document.getElementById('fSubmit').addEventListener('click', async () => {
  const n = document.getElementById('fn').value.trim();
  const em = document.getElementById('fe').value.trim();
  const msg = document.getElementById('fm').value.trim();
  
  if (!n) { showToast('⚠ Please enter your name.'); return; }
  if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { showToast('⚠ Please enter a valid email.'); return; }
  if (!msg) { showToast('⚠ Please write a message.'); return; }

  const WEBHOOK_URL = "https://discord.com/api/webhooks/1507790858106437867/QbUpQwERt4DCaLgh9jUdseIMznp_BlUzlyO_cQxU_ho8KbeIZm74y2esNJCRuhPfOmpx"; 

  document.getElementById('fWrap').style.display = 'none';
  document.getElementById('fDone').style.display = 'block';

  try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          embeds: [{
            title: "📩 New Portfolio Contact Message",
            color: 5814783,
            fields: [
              { name: "Name", value: n, inline: true },

      });

  setTimeout(() => {

      document.getElementById('fDone').style.display = 'none';
      ['fn','fe','fm'].forEach(id => document.getElementById(id).value = '');
    }, 400);
  }, 3000);
});
