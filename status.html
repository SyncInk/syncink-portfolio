<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="SyncInk Official Bots — Full details, commands, and features for SyncInk, Radio, Ticket and Voice bots."/>
<title>Sync Ink | Bots</title>
<link rel="icon" type="image/svg+xml" href="si-favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script>
// =========================================================================
// REAL-TIME API ENDPOINT
// You MUST run a backend server (like the Express server provided) to supply this data!
// Change this URL to your bot's IP address or domain when you host it.
// =========================================================================
const API_URL = "http://localhost:3000/api/status"; 

const bots = [
  { name: 'SyncInk&copy;', id: 'main', type: 'Core Bot' },
  { name: 'SyncInk&copy; Radio', id: 'radio', type: 'Music Node' },
  { name: 'SyncInk&copy; Ticket', id: 'ticket', type: 'Support System' },
  { name: 'SyncInk&copy; Voice', id: 'voice', type: 'Voice Manager' }
];

function renderGrid() {
  const grid = document.getElementById('statusGrid');
  grid.innerHTML = bots.map(b => `
    <div id="card-${b.id}" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; transition: all 0.3s; position: relative; overflow: hidden;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <div>
          <div style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.2rem;">${b.type}</div>
          <div style="font-weight: 800; font-size: 1.2rem; color: var(--text);">${b.name}</div>
        </div>
        <div id="dot-${b.id}" style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.5);"></div>
      </div>
      <div style="display: flex; gap: 2rem;">
        <div>
          <div style="font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem;">Status</div>
          <div id="status-${b.id}" style="font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #ef4444; font-weight: 600;">FETCHING...</div>
        </div>
        <div>
          <div style="font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem;">Latency</div>
          <div id="ping-${b.id}" style="font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #ef4444; font-weight: 600;">--ms</div>
        </div>
      </div>
    </div>
  `).join('');
}

async function updateStatus() {
  let hasBadPing = true;
  let hasWarning = false;

  try {
    const res = await fetch(API_URL, { mode: 'cors' });
    if (!res.ok) throw new Error("API Error");
    const data = await res.json();
    hasBadPing = false;

    bots.forEach(b => {
      const botData = data[b.id];
      const pingEl = document.getElementById(`ping-${b.id}`);
      const statusEl = document.getElementById(`status-${b.id}`);
      const dotEl = document.getElementById(`dot-${b.id}`);

      if (!botData || botData.status === 'OFFLINE') {
        pingEl.innerHTML = 'ERR';
        pingEl.style.color = '#ef4444';
        statusEl.innerHTML = 'OFFLINE';
        statusEl.style.color = '#ef4444';
        dotEl.style.background = '#ef4444';
        dotEl.style.boxShadow = '0 0 10px rgba(239,68,68,0.5)';
        hasBadPing = true;
      } else {
        const ping = botData.ping;
        pingEl.innerHTML = ping + 'ms';
        if (ping > 150) {
          statusEl.innerHTML = 'DEGRADED';
          statusEl.style.color = '#f59e0b';
          dotEl.style.background = '#f59e0b';
          dotEl.style.boxShadow = '0 0 10px rgba(245,158,11,0.5)';
          pingEl.style.color = '#f59e0b';
          hasWarning = true;
        } else {
          statusEl.innerHTML = 'ONLINE';
          statusEl.style.color = '#22c55e';
          dotEl.style.background = '#22c55e';
          dotEl.style.boxShadow = '0 0 10px rgba(34,197,94,0.5)';
          pingEl.style.color = 'var(--text)';
        }
      }
    });
  } catch (error) {
    bots.forEach(b => {
      document.getElementById(`ping-${b.id}`).innerHTML = 'ERR';
      document.getElementById(`ping-${b.id}`).style.color = '#ef4444';
      document.getElementById(`status-${b.id}`).innerHTML = 'API OFFLINE';
      document.getElementById(`status-${b.id}`).style.color = '#ef4444';
      document.getElementById(`dot-${b.id}`).style.background = '#ef4444';
      document.getElementById(`dot-${b.id}`).style.boxShadow = '0 0 10px rgba(239,68,68,0.5)';
    });
    hasBadPing = true;
  }

  const navDots = document.querySelectorAll('.global-status-dot');
  navDots.forEach(dot => {
    if (hasBadPing) dot.className = 'status-dot global-status-dot bad';
    else if (hasWarning) dot.className = 'status-dot global-status-dot warning';
    else dot.className = 'status-dot global-status-dot';
  });
}

document.addEventListener('DOMContentLoaded', () => {
    renderGrid();
    updateStatus();
    setInterval(updateStatus, 5000);
});
</script>
</div>
</body>
</html>
